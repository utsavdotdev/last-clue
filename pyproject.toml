[project]
name = "the-last-clue"
version = "1.0.0"
description = "The Last Clue: Spooky Multiplayer Imposter Game for Arduino UNO Q"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
